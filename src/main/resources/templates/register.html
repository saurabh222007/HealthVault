<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register – HealthVault Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Brand -->
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none">
                    <i class="bi bi-heart-pulse-fill text-primary display-4"></i>
                    <h2 class="fw-bold text-dark mt-2">Create Your Account</h2>
                </a>
                <p class="text-muted">Join HealthVault Cloud today</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <!-- Register Card -->
            <div class="card shadow-lg border-0">
                <div class="card-body p-4">
                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                   placeholder="Dr. / Mr. / Ms. Full Name">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="you@email.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="Minimum 6 characters">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                   placeholder="Re-enter your password">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">I am a...</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           th:field="*{role}" value="PATIENT" id="patient">
                                    <label class="form-check-label" for="patient">
                                        <i class="bi bi-person-fill text-info me-1"></i> Patient
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           th:field="*{role}" value="DOCTOR" id="doctor">
                                    <label class="form-check-label" for="doctor">
                                        <i class="bi bi-person-badge-fill text-success me-1"></i> Doctor
                                    </label>
                                </div>
                            </div>
                            <div class="text-danger small mt-1" th:errors="*{role}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-person-plus-fill me-2"></i>Create Account
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3 text-muted">
                Already have an account?
                <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
