<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Profile – HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill me-2"></i>HealthVault Cloud</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <span class="text-white opacity-75 small" th:text="${doctor.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-white shadow-sm min-vh-100 py-4 px-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/doctor/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/doctor/patients"><i class="bi bi-people me-2"></i>All Patients</a></li>
                <li class="nav-item mb-1"><a class="nav-link active rounded" href="/doctor/profile"><i class="bi bi-person-badge me-2"></i>My Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-10 px-4 py-4">
            <h3 class="fw-bold mb-4"><i class="bi bi-person-badge-fill text-success me-2"></i>Doctor Profile</h3>

            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">Professional Information</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/doctor/profile}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" th:value="${doctor.user.fullName}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" th:value="${doctor.user.email}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Specialization</label>
                                <input type="text" name="specialization" class="form-control"
                                       th:value="${doctor.specialization}" placeholder="e.g. Cardiology, General Medicine">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Medical License Number</label>
                                <input type="text" name="licenseNumber" class="form-control"
                                       th:value="${doctor.licenseNumber}" placeholder="MCI/SMC License Number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone</label>
                                <input type="tel" name="phone" class="form-control"
                                       th:value="${doctor.phone}" placeholder="+91 9876543210">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Hospital / Clinic Name</label>
                                <input type="text" name="hospitalName" class="form-control"
                                       th:value="${doctor.hospitalName}" placeholder="e.g. City Medical Center">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Qualifications</label>
                                <input type="text" name="qualifications" class="form-control"
                                       th:value="${doctor.qualifications}" placeholder="e.g. MBBS, MD, FRCS">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Years of Experience</label>
                                <input type="number" name="experienceYears" class="form-control"
                                       th:value="${doctor.experienceYears}" min="0" max="60">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success px-5">
                                    <i class="bi bi-save-fill me-2"></i>Save Profile
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
