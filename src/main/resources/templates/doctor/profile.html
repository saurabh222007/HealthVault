<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physician Profile | HealthVault Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top" style="background: #0f766e;">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/doctor/dashboard">
            <span class="navbar-brand-icon" style="background: #115e59;"><i class="bi bi-hospital"></i></span>
            <span>HealthVault <span class="badge bg-white text-dark ms-1 small">Clinician Portal</span></span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small fw-semibold" th:text="${doctor.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm px-3">Sign Out</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-none d-md-block app-sidebar app-sidebar-doctor py-4 px-3">
            <div class="text-uppercase text-muted fw-bold mb-2 ps-2" style="font-size: 0.72rem;">Clinical Controls</div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/doctor/dashboard"><i class="bi bi-speedometer2"></i> Clinical Overview</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctor/patients"><i class="bi bi-people-fill"></i> Patient Directory</a></li>
                <li class="nav-item"><a class="nav-link active" href="/doctor/profile"><i class="bi bi-person-badge"></i> Practitioner Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="mb-4">
                <h3 class="fw-bold mb-1">Medical Practitioner Credentials</h3>
                <p class="text-muted small mb-0">Manage hospital affiliation, specialization registry, and medical licensing details.</p>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show small">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="surface-card p-4 p-md-5">
                <form th:action="@{/doctor/profile}" method="post">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Physician Name</label>
                            <input type="text" class="form-control bg-light" th:value="${doctor.user.fullName}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Email Identity</label>
                            <input type="email" class="form-control bg-light" th:value="${doctor.user.email}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Clinical Specialization</label>
                            <input type="text" name="specialization" class="form-control"
                                   th:value="${doctor.specialization}" placeholder="e.g. Cardiology, Internal Medicine, Pulmonology">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Medical Council Registration / License ID</label>
                            <input type="text" name="licenseNumber" class="form-control"
                                   th:value="${doctor.licenseNumber}" placeholder="e.g. MCI/SMC Reg. 849204">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Official Contact Phone</label>
                            <input type="tel" name="phone" class="form-control"
                                   th:value="${doctor.phone}" placeholder="+91 98765 43210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Hospital / Clinical Facility Name</label>
                            <input type="text" name="hospitalName" class="form-control"
                                   th:value="${doctor.hospitalName}" placeholder="e.g. City General Hospital & Research Center">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold text-muted">Professional Degrees & Certifications</label>
                            <input type="text" name="qualifications" class="form-control"
                                   th:value="${doctor.qualifications}" placeholder="e.g. MBBS, MD (General Medicine), DNB">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Years of Clinical Experience</label>
                            <input type="number" name="experienceYears" class="form-control"
                                   th:value="${doctor.experienceYears}" min="0" max="60">
                        </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-teal text-white px-4 py-2 fw-semibold" style="background: #0d9488;">
                                <i class="bi bi-check2-circle me-1"></i> Update Clinical Credentials
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
