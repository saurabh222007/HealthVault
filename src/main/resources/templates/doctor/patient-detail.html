<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Detail – HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill me-2"></i>HealthVault Cloud</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <span class="text-white opacity-75 small" th:text="${doctor.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-white shadow-sm min-vh-100 py-4 px-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/doctor/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-1"><a class="nav-link active rounded" href="/doctor/patients"><i class="bi bi-people me-2"></i>All Patients</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/doctor/profile"><i class="bi bi-person-badge me-2"></i>My Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-10 px-4 py-4">
            <!-- Back button -->
            <a href="/doctor/patients" class="btn btn-outline-secondary btn-sm mb-3">
                <i class="bi bi-arrow-left me-1"></i>Back to Patients
            </a>

            <!-- Patient Info Card -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-person-fill me-2"></i>
                        <span th:text="${patient.user.fullName}">Patient Name</span>
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <small class="text-muted">Email</small>
                            <p class="fw-semibold mb-0" th:text="${patient.user.email}"></p>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Blood Group</small>
                            <p class="fw-semibold mb-0">
                                <span class="badge bg-danger fs-6" th:text="${patient.bloodGroup != null ? patient.bloodGroup : '—'}"></span>
                            </p>
                        </div>
                        <div class="col-md-3">
                            <small class="text-muted">Date of Birth</small>
                            <p class="fw-semibold mb-0" th:text="${patient.dateOfBirth != null ? patient.dateOfBirth : '—'}"></p>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Phone</small>
                            <p class="fw-semibold mb-0" th:text="${patient.phone != null ? patient.phone : '—'}"></p>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Allergies</small>
                            <p class="fw-semibold mb-0" th:text="${patient.allergies != null ? patient.allergies : 'None'}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medical Records -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-file-medical-fill text-primary me-2"></i>
                        Medical Records
                        <span class="badge bg-primary ms-2" th:text="${records.size()}"></span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div th:if="${records.empty}" class="text-center py-5 text-muted">
                        <i class="bi bi-folder-x display-4 d-block mb-3"></i>
                        <p>No medical records found for this patient.</p>
                    </div>
                    <div th:if="${!records.empty}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>File Name</th>
                                    <th>Upload Date</th>
                                    <th>View File</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="record, stat : ${records}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td class="fw-semibold" th:text="${record.title}"></td>
                                    <td><span class="badge bg-primary" th:text="${record.recordType.name().replace('_',' ')}"></span></td>
                                    <td class="text-muted small" th:text="${record.description}"></td>
                                    <td class="small">
                                        <i class="bi bi-file-earmark me-1"></i>
                                        <span th:text="${record.fileName}"></span>
                                    </td>
                                    <td class="text-muted small"
                                        th:text="${#temporals.format(record.uploadedAt, 'dd MMM yyyy')}"></td>
                                    <td>
                                        <a th:href="${record.fileUrl}" target="_blank"
                                           class="btn btn-sm btn-success">
                                            <i class="bi bi-cloud-download me-1"></i>Open
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
