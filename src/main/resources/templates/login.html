<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | HealthVault Cloud Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- Brand Header -->
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none">
                    <span class="navbar-brand-icon mb-2"><i class="bi bi-shield-plus"></i></span>
                    <h3 class="fw-bold text-dark mt-2 mb-1">HealthVault Cloud</h3>
                </a>
                <p class="text-muted small">Sign in to your clinical or patient vault</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show small" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Card -->
            <div class="surface-card p-4">
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0"
                                   placeholder="name@domain.com" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-muted mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0"
                                   placeholder="Enter account password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter
                    </button>
                </form>

                <div class="border-top pt-3 mt-4 text-center">
                    <small class="text-muted">
                        New user to HealthVault?
                        <a href="/register" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
                    </small>
                </div>
            </div>

            <div class="text-center mt-3 text-muted small">
                <i class="bi bi-lock-fill me-1"></i> Protected by BCrypt & TLS 1.3 Encryption
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
