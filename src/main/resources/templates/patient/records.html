<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Records – HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill me-2"></i>HealthVault Cloud</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <span class="text-white opacity-75 small" th:text="${patient.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-white shadow-sm min-vh-100 py-4 px-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-1"><a class="nav-link active rounded" href="/patient/records"><i class="bi bi-file-medical me-2"></i>My Records</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/upload"><i class="bi bi-cloud-upload me-2"></i>Upload Record</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/profile"><i class="bi bi-person-gear me-2"></i>My Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-10 px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0"><i class="bi bi-file-medical-fill text-primary me-2"></i>My Medical Records</h3>
                <a href="/patient/upload" class="btn btn-primary"><i class="bi bi-cloud-upload me-2"></i>Upload New</a>
            </div>

            <!-- Alerts -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filter Tabs -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body py-2 px-3">
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/patient/records}"
                           th:class="${selectedType == null} ? 'btn btn-primary btn-sm' : 'btn btn-outline-primary btn-sm'">
                            All Records
                        </a>
                        <a th:each="type : ${recordTypes}"
                           th:href="@{/patient/records(type=${type.name()})}"
                           th:class="${selectedType == type.name()} ? 'btn btn-primary btn-sm' : 'btn btn-outline-secondary btn-sm'"
                           th:text="${type.name().replace('_',' ')}"></a>
                    </div>
                </div>
            </div>

            <!-- Records Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div th:if="${records.empty}" class="text-center py-5 text-muted">
                        <i class="bi bi-folder-x display-4 mb-3 d-block"></i>
                        <p>No records found.</p>
                        <a href="/patient/upload" class="btn btn-primary">Upload Your First Record</a>
                    </div>
                    <div th:if="${!records.empty}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-primary">
                                <tr>
                                    <th>#</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>File</th>
                                    <th>Uploaded</th>
                                    <th>Cloud</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="record, stat : ${records}">
                                    <td class="text-muted" th:text="${stat.index + 1}"></td>
                                    <td class="fw-semibold" th:text="${record.title}"></td>
                                    <td>
                                        <span class="badge bg-primary"
                                              th:text="${record.recordType.name().replace('_',' ')}"></span>
                                    </td>
                                    <td class="text-muted small"
                                        th:text="${#strings.abbreviate(record.description, 50)}"></td>
                                    <td>
                                        <i class="bi bi-file-earmark-fill text-secondary me-1"></i>
                                        <small th:text="${record.fileName}"></small>
                                    </td>
                                    <td class="text-muted small"
                                        th:text="${#temporals.format(record.uploadedAt, 'dd MMM yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="badge bg-success-subtle text-success">
                                            <i class="bi bi-cloud-check-fill me-1"></i>Stored
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="${record.fileUrl}" target="_blank"
                                           class="btn btn-sm btn-outline-success me-1" title="View File">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <form th:action="@{'/patient/records/' + ${record.id} + '/delete'}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Delete this record?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
