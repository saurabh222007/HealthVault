<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile – HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill me-2"></i>HealthVault Cloud</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <span class="text-white opacity-75 small" th:text="${patient.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-white shadow-sm min-vh-100 py-4 px-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/records"><i class="bi bi-file-medical me-2"></i>My Records</a></li>
                <li class="nav-item mb-1"><a class="nav-link rounded" href="/patient/upload"><i class="bi bi-cloud-upload me-2"></i>Upload Record</a></li>
                <li class="nav-item mb-1"><a class="nav-link active rounded" href="/patient/profile"><i class="bi bi-person-gear me-2"></i>My Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-10 px-4 py-4">
            <h3 class="fw-bold mb-4"><i class="bi bi-person-fill text-primary me-2"></i>My Health Profile</h3>

            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">Personal & Medical Information</h5>
                    <small class="text-muted">This information helps doctors understand your health background.</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/patient/profile}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" th:value="${patient.user.fullName}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" th:value="${patient.user.email}" disabled>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" name="dateOfBirth" class="form-control"
                                       th:value="${patient.dateOfBirth}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Blood Group</label>
                                <select name="bloodGroup" class="form-select">
                                    <option value="">Select...</option>
                                    <option th:each="bg : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }"
                                            th:value="${bg}" th:text="${bg}"
                                            th:selected="${bg == patient.bloodGroup}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control"
                                       th:value="${patient.phone}" placeholder="+91 9876543210">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Address</label>
                                <textarea name="address" class="form-control" rows="2"
                                          th:text="${patient.address}" placeholder="Your full address"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Emergency Contact</label>
                                <input type="text" name="emergencyContact" class="form-control"
                                       th:value="${patient.emergencyContact}" placeholder="Name & Phone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Known Allergies</label>
                                <input type="text" name="allergies" class="form-control"
                                       th:value="${patient.allergies}" placeholder="e.g. Penicillin, Dust">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Existing Medical Conditions</label>
                                <input type="text" name="existingConditions" class="form-control"
                                       th:value="${patient.existingConditions}" placeholder="e.g. Diabetes, Hypertension">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-save-fill me-2"></i>Save Profile
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
