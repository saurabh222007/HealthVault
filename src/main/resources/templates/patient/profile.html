<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Profile | HealthVault Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/patient/dashboard">
            <span class="navbar-brand-icon"><i class="bi bi-shield-plus"></i></span>
            <span>HealthVault <span class="badge bg-primary-subtle text-primary ms-1 small">Patient Portal</span></span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small fw-semibold" th:text="${patient.user.fullName}"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm px-3">Sign Out</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-none d-md-block app-sidebar py-4 px-3">
            <div class="text-uppercase text-muted fw-bold mb-2 ps-2" style="font-size: 0.72rem;">Vault Controls</div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/patient/dashboard"><i class="bi bi-grid-1x2"></i> Overview</a></li>
                <li class="nav-item"><a class="nav-link" href="/patient/records"><i class="bi bi-folder2-open"></i> Medical Archive</a></li>
                <li class="nav-item"><a class="nav-link" href="/patient/upload"><i class="bi bi-cloud-arrow-up"></i> Upload Document</a></li>
                <li class="nav-item"><a class="nav-link active" href="/patient/profile"><i class="bi bi-person-lines-fill"></i> Health Profile</a></li>
            </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="mb-4">
                <h3 class="fw-bold mb-1">Patient Clinical Profile</h3>
                <p class="text-muted small mb-0">Maintain demographic indicators, blood markers, and emergency contact registries.</p>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show small">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="surface-card p-4 p-md-5">
                <form th:action="@{/patient/profile}" method="post">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Full Legal Name</label>
                            <input type="text" class="form-control bg-light" th:value="${patient.user.fullName}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Registered Email Address</label>
                            <input type="email" class="form-control bg-light" th:value="${patient.user.email}" disabled>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Date of Birth</label>
                            <input type="date" name="dateOfBirth" class="form-control" th:value="${patient.dateOfBirth}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Blood Group / Rh Factor</label>
                            <select name="bloodGroup" class="form-select">
                                <option value="">Select Blood Group...</option>
                                <option th:each="bg : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }"
                                        th:value="${bg}" th:text="${bg}"
                                        th:selected="${bg == patient.bloodGroup}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-muted">Phone Number</label>
                            <input type="tel" name="phone" class="form-control"
                                   th:value="${patient.phone}" placeholder="+91 98765 43210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Residential Address</label>
                            <textarea name="address" class="form-control" rows="2"
                                      th:text="${patient.address}" placeholder="Street address, City, Postal Code"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Emergency Contact Protocol</label>
                            <input type="text" name="emergencyContact" class="form-control"
                                   th:value="${patient.emergencyContact}" placeholder="Contact Name & Contact Number">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Known Clinical Allergies</label>
                            <input type="text" name="allergies" class="form-control"
                                   th:value="${patient.allergies}" placeholder="e.g. Penicillin, NSAIDs, Latexes">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Pre-Existing Medical Conditions</label>
                            <input type="text" name="existingConditions" class="form-control"
                                   th:value="${patient.existingConditions}" placeholder="e.g. Type II Diabetes, Hypertension">
                        </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i> Update Health Profile
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
