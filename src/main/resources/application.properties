# =============================================
# HealthVault Cloud - Application Configuration
# =============================================

spring.application.name=HealthVault Cloud

# -----------------------------------------------
# SERVER
# -----------------------------------------------
server.port=8080

# -----------------------------------------------
# DATABASE - Supabase PostgreSQL
# Replace with your Supabase project credentials
# Get from: Supabase Dashboard -> Settings -> Database
# -----------------------------------------------
spring.datasource.url=jdbc:postgresql://YOUR_SUPABASE_HOST:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------
# THYMELEAF
# -----------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------
# FILE UPLOAD (Supabase Storage)
# Replace with your Supabase project details
# Get from: Supabase Dashboard -> Settings -> API
# -----------------------------------------------
supabase.url=https://YOUR_PROJECT_REF.supabase.co
supabase.anon.key=YOUR_SUPABASE_ANON_KEY
supabase.storage.bucket=medical-records

# -----------------------------------------------
# FILE UPLOAD SIZE LIMITS
# -----------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------
# LOGGING
# -----------------------------------------------
logging.level.com.healthvault=DEBUG
logging.level.org.springframework.security=INFO
